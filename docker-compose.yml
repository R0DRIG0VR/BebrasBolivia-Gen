services:
  # ----------------------------------------------------------------------------
  # BASE DE DATOS PostgreSQL (local, en contenedor)
  # Las credenciales se inyectan desde el archivo .env que genera deploy.sh.
  # ----------------------------------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: bebras_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # SERVICIO DE USUARIO (Express + Prisma) - puerto 4102
  # Aplica migraciones de Prisma al arrancar (ver docker-entrypoint.sh).
  # ----------------------------------------------------------------------------
  user-service:
    build:
      context: ./servicios/servicio-usuario
      dockerfile: Dockerfile
    container_name: bebras_user_service
    restart: always
    environment:
      NODE_ENV: production
      USER_SERVICE_PORT: 4102
      # El schema "bebras" del proyecto se pasa en la cadena de conexion.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}?schema=bebras
    ports:
      - "4102:4102"
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
